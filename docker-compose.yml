# Composición local del MVP: PostgreSQL, backend (.NET 10) y frontend (React + Vite).
# Ninguna cadena de conexión, contraseña, capacidad ni zona horaria está escrita aquí:
# todo proviene de variables definidas en el único .env versionado de la raíz.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Veterinary: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      BusinessRules__SlotCapacity: ${BusinessRules__SlotCapacity}
      BusinessRules__TimeZone: ${BusinessRules__TimeZone}
      Lockout__MaxFailedAttempts: ${Lockout__MaxFailedAttempts}
      Lockout__LockoutMinutes: ${Lockout__LockoutMinutes}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_IDENTIFICATION: ${SEED_ADMIN_IDENTIFICATION}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      Cors__AllowedOrigin: ${Cors__AllowedOrigin}
      Jwt__Key: ${Jwt__Key}
      BasicAuth__Username: ${BasicAuth__Username}
      BasicAuth__Password: ${BasicAuth__Password}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_BASIC_AUTH_USERNAME: ${BasicAuth__Username}
        VITE_BASIC_AUTH_PASSWORD: ${BasicAuth__Password}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data: